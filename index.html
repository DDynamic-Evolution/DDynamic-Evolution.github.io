<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MikoStorm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }
  #rain-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  #content {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1;
  }
  #ascii-art {
    color: #fff;
    font-size: 11px;
    line-height: 1.15;
    text-align: center;
    white-space: pre;
    text-shadow: 0 0 12px rgba(255,255,255,0.25);
    margin-bottom: 40px;
  }
  #tagline {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #footer {
    position: fixed;
    bottom: 0; left: 0; width: 100%;
    text-align: center;
    padding: 12px 0;
    z-index: 2;
  }
  #footer a {
    color: #666;
    font-size: 11px;
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.3s;
  }
  #footer a:hover { color: #ccc; }

  #status-widget {
    position: fixed;
    top: 16px; left: 16px;
    z-index: 3;
    background: rgba(0,0,0,0.85);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px 16px;
    max-width: 320px;
    font-family: monospace;
    font-size: 11px;
    color: #aaa;
    line-height: 1.6;
  }
  #status-widget .title {
    color: #ccc;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 6px;
  }
  #status-widget .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    flex-shrink: 0;
  }
  #status-widget .cat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 1px 0;
  }
  #status-widget .cat-row:hover { color: #fff; }
  #status-widget .sub-list { margin-left: 20px; display: none; }
  #status-widget .sub-list.open { display: block; }
  #status-widget .sub-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #777;
    padding: 0 0 1px 0;
  }
  #status-widget .status-ok { background: #4f4; }
  #status-widget .status-degraded { background: #ff4; }
  #status-widget .status-partial { background: #f80; }
  #status-widget .status-major { background: #f44; }
  #status-widget .status-maintenance { background: #888; }
</style>
</head>
<body>
<canvas id="rain-canvas" width="1920" height="965"></canvas>
<div id="content">
  
  <div id="tagline">MikoStorm - A Second Life Viewer</div>

</div>
<div id="status-widget">
  <div class="title">Second Life Status</div>
  <div id="status-summary"></div>
  <div id="status-categories"></div>
</div>
<div>
 <audio autoplay>
   <source src="mikostorm.mp3" type="audio/mpeg">
   Dein Browser unterstützt kein Audio.
 </audio>
</div>
<div id="footer">
  <a href="https://github.com/DDynamic-Evolution/MikoStorm" target="_blank">github.com/DDynamic-Evolution/MikoStorm</a>
</div>
<script>
(function() {
  var canvas = document.getElementById('rain-canvas');
  var ctx = canvas.getContext('2d');
  var W, H, columns, drops;
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*+=[]{}|;:<>~^';
  var fontSize = 14;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    columns = Math.floor(W / fontSize);
    drops = [];
    for (var i = 0; i < columns; i++) {
      drops[i] = Math.random() * -100;
    }
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(160, 160, 160, 0.35)';
    ctx.font = fontSize + 'px monospace';
    for (var i = 0; i < columns; i++) {
      var char = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;
      ctx.fillText(char, x, y);
      if (y > H && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  window.addEventListener('resize', resize);
  resize();
  setInterval(draw, 50);

  // Status widget
  var statusMap = {
    operational: 'ok',
    degraded_performance: 'degraded',
    partial_outage: 'partial',
    major_outage: 'major',
    under_maintenance: 'maintenance'
  };
  var statusLabel = {
    operational: 'Operational',
    degraded_performance: 'Degraded Performance',
    partial_outage: 'Partial Outage',
    major_outage: 'Major Outage',
    under_maintenance: 'Maintenance'
  };
  var catNames = [
    'Second Life Regions',
    'Websites',
    'Second Life Services',
    'Inworld Services',
    'External Support'
  ];

  function renderCategories(groups) {
    var c = document.getElementById('status-categories');
    c.innerHTML = '';
    catNames.forEach(function(cat) {
      var items = groups[cat];
      if (!items || items.length === 0) return;
      var worst = items.reduce(function(w, i) {
        var o = ['operational','degraded_performance','partial_outage','major_outage','under_maintenance'];
        return o.indexOf(i.status) > o.indexOf(w) ? i.status : w;
      }, 'operational');
      var row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = '<span class="status-dot status-' + statusMap[worst] + '"></span>' + cat;
      var sub = document.createElement('div');
      sub.className = 'sub-list';
      items.forEach(function(i) {
        var s = document.createElement('div');
        s.className = 'sub-item';
        s.innerHTML = '<span class="status-dot status-' + statusMap[i.status] + '"></span>' + i.name + ' <span style="color:#555;margin-left:auto">' + statusLabel[i.status] + '</span>';
        sub.appendChild(s);
      });
      row.addEventListener('click', function() { sub.classList.toggle('open'); });
      c.appendChild(row);
      c.appendChild(sub);
    });
  }

  function groupComponents(flat) {
    var groups = {};
    var groupIdToName = {};
    (flat || []).forEach(function(c) {
      if (c.group) groupIdToName[c.id] = c.name;
    });
    (flat || []).forEach(function(c) {
      if (c.group) return;
      var cat = c.category;
      if (!cat && c.group_id) cat = groupIdToName[c.group_id];
      if (catNames.indexOf(cat) === -1) return;
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push({name: c.name, status: c.status});
    });
    return groups;
  }

  function fetchStatus() {
    fetch('users.json', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.statuspage_status) {
          var s = d.statuspage_status;
          var el = document.getElementById('status-summary');
          el.innerHTML = '<span class="status-dot status-' + statusMap[s.indicator === 'none' ? 'operational' : s.indicator] + '"></span>' + s.description;
        }
        if (d.components) renderCategories(d.components);
      })
      .catch(function() {});

    fetch('https://status.secondlifegrid.net/api/v2/status.json')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        var s = d.status;
        var el = document.getElementById('status-summary');
        el.innerHTML = '<span class="status-dot status-' + statusMap[s.indicator === 'none' ? 'operational' : s.indicator] + '"></span>' + s.description;
      })
      .catch(function() {});

    fetch('https://status.secondlifegrid.net/api/v2/components.json')
      .then(function(r) { return r.json(); })
      .then(function(d) { renderCategories(groupComponents(d.components)); })
      .catch(function() {});
  }
  fetchStatus();
  setInterval(fetchStatus, 300000);
})();
</script>


</body></html>
