name: Update SL Users
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          DATA=$(curl -s https://api.secondlife.com/datafeeds/secondlife.xml)
          USERS=$(echo "$DATA" | grep -oP '<inworld>\K[^<]+')
          SIGNUPS=$(echo "$DATA" | grep -oP '<signups>\K[^<]+')
          echo "{\"users\":$USERS,\"signups\":\"$SIGNUPS\",\"updated\":\"$(date -u -Iseconds)\"}" > users.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add users.json
          git diff --staged --quiet || git commit -m "Update users.json"
          git push
